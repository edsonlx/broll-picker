<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B-roll Picker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #141414;
    --border: #242424;
    --accent: #e8ff47;
    --accent-dim: #b8cc2e;
    --text: #f0f0f0;
    --muted: #555;
    --mono: 'Space Mono', monospace;
    --display: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--display);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    overflow-x: hidden;
  }

  /* grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2.5rem;
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
  }
  header span {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* ── PASTE SCREEN ── */
  #paste-screen { display: flex; flex-direction: column; gap: 1rem; }

  label {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.78rem;
    line-height: 1.6;
    padding: 1rem;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }
  #json-input { height: 200px; }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  /* Hidden Details for Transcription */
  details.transcription-toggle {
    margin-top: -0.5rem;
  }
  details.transcription-toggle summary {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    cursor: pointer;
    padding: 0.5rem 0;
    transition: color 0.2s;
    letter-spacing: 0.05em;
  }
  details.transcription-toggle summary:hover {
    color: var(--accent);
  }
  #transcription-input {
    margin-top: 0.5rem;
    height: 120px;
    border-color: #333;
  }

  .btn-primary {
    background: var(--accent);
    color: #0d0d0d;
    border: none;
    padding: 0.85rem 2rem;
    font-family: var(--display);
    font-size: 0.85rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s, transform 0.1s;
    align-self: flex-start;
  }
  .btn-primary:hover { background: var(--accent-dim); }
  .btn-primary:active { transform: scale(0.97); }

  .error-msg {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: #ff6b6b;
    display: none;
  }
  .error-msg.show { display: block; }

  /* ── PICKER SCREEN ── */
  #picker-screen { display: none; flex-direction: column; gap: 1.5rem; }

  /* progress bar */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .progress-bar {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
    white-space: nowrap;
  }

  /* card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    animation: slideIn 0.3s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-index {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .card-section {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .label-mini {
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .value-text {
    font-size: 0.9rem;
    line-height: 1.5;
    color: #ddd;
  }

  /* Text & Visual specific styles */
  .video-text {
    font-family: var(--display);
    font-style: italic;
    color: var(--text);
    border-left: 2px solid var(--border);
    padding-left: 0.8rem;
    margin-left: 2px;
  }
  .visual-text {
    color: var(--accent-dim);
    font-weight: 700;
  }
  .muted-empty {
    color: #555;
    font-style: italic;
    font-size: 0.8rem;
  }

  .search-query-text {
    font-size: 0.88rem;
    color: #aaa;
  }

  .filename {
    font-family: var(--mono);
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
    word-break: break-all;
    line-height: 1.5;
    background: rgba(232,255,71,0.06);
    border: 1px solid rgba(232,255,71,0.15);
    border-radius: 4px;
    padding: 0.75rem 1rem;
  }

  /* the main action link */
  .storyblocks-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    border-radius: 4px;
    padding: 1rem 1.25rem;
    text-decoration: none;
    font-family: var(--display);
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }
  .storyblocks-link:hover {
    background: var(--accent);
    color: #0d0d0d;
  }
  .storyblocks-link:active { transform: scale(0.98); }
  .storyblocks-link .link-icon { font-size: 1.1rem; flex-shrink: 0; }

  /* toast */
  #toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #0d0d0d;
    font-family: var(--mono);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 0.7rem 1.25rem;
    border-radius: 4px;
    letter-spacing: 0.08em;
    white-space: nowrap;
    z-index: 999;
    transition: transform 0.3s cubic-bezier(.4,0,.2,1), opacity 0.3s;
    opacity: 0;
    pointer-events: none;
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* navigation */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .btn-nav {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.65rem 1.25rem;
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    transition: border-color 0.2s, color 0.2s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn-nav:hover { border-color: var(--text); }
  .btn-nav:disabled { opacity: 0.2; cursor: not-allowed; }

  .btn-reset {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0.4rem 0.5rem;
    transition: color 0.2s;
  }
  .btn-reset:hover { color: var(--text); }

  /* done state */
  .done-card {
    text-align: center;
    padding: 3rem 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    align-items: center;
    animation: slideIn 0.3s cubic-bezier(.4,0,.2,1);
  }
  .done-card .check { font-size: 2.5rem; }
  .done-card h2 {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .done-card p {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>B-roll Picker</h1>
    <span>// storyblocks workflow</span>
  </header>

  <!-- PASTE SCREEN -->
  <div id="paste-screen">
    <div>
      <label for="json-input">Cole o JSON de B-rolls aqui</label>
      <textarea id="json-input" placeholder='[{"search_query": "...", "file_name": "...", "segment_start": 1, "segment_end": 2}]' spellcheck="false"></textarea>
    </div>

    <!-- Hidden Transcription Field -->
    <details class="transcription-toggle">
      <summary>► Adicionar JSON de Transcrição (Opcional)</summary>
      <textarea id="transcription-input" placeholder='Aceita 2 formatos:&#10;1) { "segments": [ { "segment": "1", "text": "..." } ] }&#10;2) [ { "segment": "1", "text": "..." } ]' spellcheck="false"></textarea>
    </details>

    <span class="error-msg" id="error-msg"></span>
    <button class="btn-primary" onclick="loadJSON()">Começar →</button>
  </div>

  <!-- PICKER SCREEN -->
  <div id="picker-screen">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label"></span>
    </div>

    <div id="card-area"></div>

    <div class="nav">
      <button class="btn-nav" id="btn-prev" onclick="navigate(-1)">← Anterior</button>
      <button class="btn-reset" onclick="reset()">Recomeçar</button>
      <button class="btn-nav" id="btn-next" onclick="navigate(1)">Próximo →</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let items = [];
  let transcriptionSegments = [];
  let current = 0;

  function loadJSON() {
    const rawBroll = document.getElementById('json-input').value.trim();
    const rawTrans = document.getElementById('transcription-input').value.trim();
    const err = document.getElementById('error-msg');
    
    try {
      // 1. Parse B-rolls
      const parsedBroll = JSON.parse(rawBroll);
      if (!Array.isArray(parsedBroll) || parsedBroll.length === 0) {
        throw new Error("O JSON de B-rolls está vazio ou não é uma lista (Array).");
      }
      items = parsedBroll;

      // 2. Parse Transcription (Optional)
      if (rawTrans) {
        const parsedTrans = JSON.parse(rawTrans);
        
        // Verifica qual dos dois formatos de transcrição foi colado
        if (Array.isArray(parsedTrans)) {
          // Formato novo: array direto [ { "segment": "1", ... } ]
          transcriptionSegments = parsedTrans;
        } else if (parsedTrans && parsedTrans.segments && Array.isArray(parsedTrans.segments)) {
          // Formato antigo: objeto com chave segments { "segments": [ ... ] }
          transcriptionSegments = parsedTrans.segments;
        } else {
          throw new Error("JSON de Transcrição inválido. Use um Array ou um objeto com a chave 'segments'.");
        }
      } else {
        transcriptionSegments = [];
      }

      current = 0;
      err.classList.remove('show');
      document.getElementById('paste-screen').style.display = 'none';
      const ps = document.getElementById('picker-screen');
      ps.style.display = 'flex';
      renderCard();
    } catch (e) {
      err.textContent = e.message || "JSON inválido. Verifique o formato e tente novamente.";
      err.classList.add('show');
    }
  }

  function getTranscriptionText(startId, endId) {
    if (!transcriptionSegments || transcriptionSegments.length === 0) return "";
    
    const s = parseInt(startId, 10);
    let e = parseInt(endId, 10);
    
    // Se o segment_end for null, undefined ou não for um número, 
    // assumimos que queremos pegar apenas 1 segmento (o start).
    if (isNaN(e)) {
      e = s;
    }
    
    // Filtra todos os segmentos que estão dentro do range (inclusivo)
    const segmentsInRange = transcriptionSegments.filter(seg => {
      // Pega o ID de 'segment' (ou fallback para 'id')
      const rawId = seg.segment !== undefined ? seg.segment : seg.id;
      const id = parseInt(rawId, 10);
      return !isNaN(id) && id >= s && id <= e;
    });

    // Ordena para garantir a ordem cronológica
    segmentsInRange.sort((a, b) => {
      const idA = parseInt(a.segment !== undefined ? a.segment : a.id, 10);
      const idB = parseInt(b.segment !== undefined ? b.segment : b.id, 10);
      return idA - idB;
    });

    // Junta os textos
    return segmentsInRange.map(seg => seg.text).join(" ").trim();
  }

  function renderCard() {
    const total = items.length;
    const item = items[current];

    // progress
    document.getElementById('progress-fill').style.width = ((current + 1) / total * 100) + '%';
    document.getElementById('progress-label').textContent = `${current + 1} / ${total}`;

    // nav buttons
    document.getElementById('btn-prev').disabled = current === 0;
    document.getElementById('btn-next').disabled = current === total - 1;

    const area = document.getElementById('card-area');

    if (!item) {
      area.innerHTML = `
        <div class="done-card">
          <div class="check">✓</div>
          <h2>Tudo pronto!</h2>
          <p>Você passou por todos os ${total} itens.</p>
        </div>`;
      return;
    }

    // Lógica para obter o texto
    let textToShow = item.text || ""; // Se o JSON de broll já tiver 'text', usa ele
    
    // Se não tem texto direto, mas tem um "segment_start" válido, busca na transcrição
    if (!textToShow && item.segment_start !== undefined && item.segment_start !== null) {
      textToShow = getTranscriptionText(item.segment_start, item.segment_end);
    }
    
    const visualText = item.visual || "Não especificado";
    const query = encodeURIComponent(item.search_query || "");
    const url = 'https://www.storyblocks.com/all-video/search/' + query + '?search-origin=search_bar';

    area.innerHTML = `
      <div class="card">
        <div class="card-index">Item ${current + 1} de ${total}</div>

        <div class="card-section">
          <div class="label-mini">Texto do Vídeo (Fala)</div>
          <div class="value-text video-text">
            ${textToShow ? escHtml(textToShow) : '<span class="muted-empty">Sem texto associado</span>'}
          </div>
        </div>

        <div class="card-section">
          <div class="label-mini">Direção Visual</div>
          <div class="value-text visual-text">${escHtml(visualText)}</div>
        </div>

        <div class="card-section">
          <div class="label-mini">Termo de Busca (Storyblocks)</div>
          <div class="search-query-text">${escHtml(item.search_query || "")}</div>
        </div>

        <div class="card-section">
          <div class="label-mini">Nome final do arquivo</div>
          <div class="filename">${escHtml(item.file_name || "")}</div>
        </div>

        <a class="storyblocks-link"
           href="${url}"
           target="_blank"
           rel="noopener"
           onclick="copyToClipboard('${escAttr(item.file_name || "")}')">
          <span>Abrir Storyblocks &amp; Copiar Nome</span>
          <span class="link-icon">↗</span>
        </a>
      </div>`;
  }

  function copyToClipboard(text) {
    if (!text) return;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => showToast(text));
    } else {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(text);
    }
  }

  let toastTimer;
  function showToast(text) {
    const t = document.getElementById('toast');
    t.textContent = '✓ copiado: ' + text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  function navigate(dir) {
    current = Math.max(0, Math.min(items.length - 1, current + dir));
    renderCard();
  }

  function reset() {
    items = []; 
    transcriptionSegments = [];
    current = 0;
    document.getElementById('picker-screen').style.display = 'none';
    const ps = document.getElementById('paste-screen');
    ps.style.display = 'flex';
    document.getElementById('json-input').value = '';
    document.getElementById('transcription-input').value = '';
    // fecha o details por padrão no reset
    document.querySelector('.transcription-toggle').removeAttribute('open');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(s) {
    return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');
  }

  // allow Ctrl+Enter on either textarea to submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.ctrlKey) {
      const active = document.activeElement;
      if (active.id === 'json-input' || active.id === 'transcription-input') {
        loadJSON();
      }
    }
  });
</script>
</body>
</html>
